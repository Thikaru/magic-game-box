<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY GAMES — 本日のゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .notice-btn { font-family:'M PLUS Rounded 1c',sans-serif; font-size:.85rem; color:var(--paper);
    background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.4); border-radius:8px;
    padding:6px 12px; min-height:36px; cursor:pointer; }
  dialog#noticeDialog { border:0; border-radius:12px; padding:22px; max-width:340px; width:88%;
    background:var(--paper); color:var(--ink); font-family:var(--body); }
  dialog#noticeDialog::backdrop { background:rgba(0,0,0,.6); }
  dialog#noticeDialog h2 { font-family:var(--display); color:var(--carpet); font-size:1.2rem; margin-bottom:12px; }
  dialog#noticeDialog p { line-height:1.8; font-size:.9rem; margin-bottom:18px; }
  dialog#noticeDialog button { font-family:var(--display); font-size:1rem; background:var(--marquee);
    color:var(--ink); border:0; border-radius:10px; padding:10px 28px; min-height:44px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="logo" href="index.html">DAILY<span>GAMES</span></a>
    <nav>
      <button type="button" class="notice-btn" id="noticeBtn">⚠️ 注意事項</button>
      <a href="archive.html">過去のゲームで遊ぶ</a>
    </nav>
  </header>

  <dialog id="noticeDialog">
    <h2>注意事項</h2>
    <p>このサイトのゲームは Claude Code によって自動生成されています。ゲーム内で使用しているBGM(音楽)についても、AIによって生成されたものです。</p>
    <button type="button" id="noticeCloseBtn">閉じる</button>
  </dialog>

  <main class="marquee">
    <div class="marquee-inner" id="today">
      <p class="empty">読み込み中…</p>
    </div>
  </main>

  <footer class="site">毎朝6時、Claude Code が新しいゲームを1本つくります。</footer>
</div>

<script>
document.getElementById('noticeBtn').addEventListener('click', () => {
  document.getElementById('noticeDialog').showModal();
});
document.getElementById('noticeCloseBtn').addEventListener('click', () => {
  document.getElementById('noticeDialog').close();
});

fetch('games.json?' + Date.now())
  .then(r => r.json())
  .then(data => {
    const g = data.games && data.games[0];
    const box = document.getElementById('today');
    if (!g) {
      box.innerHTML = '<p class="empty">まだゲームがありません。明日の朝6時をお楽しみに。</p>';
      return;
    }
    box.innerHTML = `
      <p class="eyebrow">TODAY'S GAME</p>
      <h1 class="today-title"></h1>
      <span class="today-genre"></span>
      <p class="today-desc"></p>
      <a class="play-btn" href="">あそぶ</a>
      <p class="date-label"></p>`;
    box.querySelector('.today-title').textContent = g.title;
    box.querySelector('.today-genre').textContent = g.genre;
    box.querySelector('.today-desc').textContent = g.description;
    box.querySelector('.play-btn').href = g.path;
    box.querySelector('.date-label').textContent = g.date + ' 配信';
  })
  .catch(() => {
    document.getElementById('today').innerHTML =
      '<p class="empty">games.json を読み込めませんでした。</p>';
  });
</script>
</body>
</html>
