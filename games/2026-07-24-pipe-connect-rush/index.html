<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>パイプコネクト・ラッシュ — DAILY GAMES</title>
<style>
  :root { --bg1:#0b2032; --bg2:#082a3d; --pipe:#1c4a63; --flow:#33e0b0; --star:#ffd23f; --ink:#eaf6f7; --accent:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'M PLUS Rounded 1c',system-ui,-apple-system,sans-serif; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--ink); min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 12px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  header a { color:var(--ink); text-decoration:none; font-size:.85rem; border-bottom:2px dotted var(--flow); }
  h1 { font-size:1.25rem; letter-spacing:.02em; }
  .stage { position:relative; }
  canvas { display:block; width:100%; height:auto; border:4px solid var(--pipe); border-radius:12px; background:#06202f; touch-action:none; }
  .overlay { position:absolute; inset:4px; border-radius:8px; background:rgba(6,32,47,.94);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; overflow-y:auto; }
  .overlay h2 { color:var(--star); font-size:1.5rem; margin-bottom:14px; }
  .overlay p { line-height:1.8; font-size:.9rem; margin-bottom:8px; }
  .overlay .btn { margin-top:16px; font-size:1.05rem; background:var(--flow);
    color:#06202f; font-weight:700; border:0; border-radius:10px; padding:12px 36px; box-shadow:0 5px 0 #1a8f6e; cursor:pointer; }
  .overlay .btn:hover { transform:translateY(2px); box-shadow:0 3px 0 #1a8f6e; }
  .hidden { display:none; }
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.9rem; color:var(--ink); margin-top:10px; flex-wrap:wrap; }
  .hud .lives { color:var(--accent); }
  .timerBarWrap { margin-top:8px; height:12px; border-radius:6px; background:#04141f; border:2px solid var(--pipe); overflow:hidden; }
  .timerBar { height:100%; background:linear-gradient(90deg,var(--flow),#7cf0d0); width:100%; transition:width .1s linear; }
  .hint { font-size:.78rem; opacity:.85; margin-top:8px; text-align:center; }
  .musicBar { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:.85rem; flex-wrap:wrap; }
  .musicBar select { font-family:inherit; font-size:.9rem; min-height:44px; border-radius:8px; border:1px solid #ffd23f; background:#fffdf5; color:#1c1c28; padding:0 8px; }
  .musicToggle { font-family:inherit; font-size:.85rem; color:#fffdf5; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.45); border-radius:8px; padding:0 12px; min-height:44px; cursor:pointer; }
  .vpadArea { max-width:560px; margin:14px auto 0; padding:0 12px; display:flex;
    flex-direction:column; align-items:center; gap:10px; }
  .vpadToggle { font-family:inherit; font-size:.85rem; color:#fff; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:0 14px; min-height:40px; cursor:pointer; }
  .vpadPanel { display:flex; align-items:center; justify-content:center; gap:28px; width:100%;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); border-radius:16px; padding:16px; }
  .vpadPanel.hidden { display:none; }
  .vpad { position:relative; width:132px; height:132px; flex-shrink:0; }
  .vpadBtn { position:absolute; width:44px; height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  .vpadUp    { left:44px; top:0; }
  .vpadLeft  { left:0;    top:44px; }
  .vpadRight { left:88px; top:44px; }
  .vpadDown  { left:44px; top:88px; }
  .vpadR { width:60px; height:60px; flex-shrink:0; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,210,63,.9); color:#1c1c28; font-weight:700; font-size:1.1rem; touch-action:none;
    user-select:none; -webkit-user-select:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>パイプコネクト・ラッシュ</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="musicBar">
    <button type="button" class="musicToggle" id="musicToggle">🔊 BGM ON</button>
    <label for="musicSelect">🎵 BGM</label>
    <select id="musicSelect">
      <option value="pop">ポップ</option>
      <option value="speed">スピード</option>
      <option value="dark">ダーク</option>
      <option value="limit">リミット</option>
    </select>
  </div>

  <div class="stage">
    <canvas id="game" width="480" height="480"></canvas>

    <!-- 説明画面: 必須要件1 -->
    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>タップ/クリックでパイプを90°回して、左の <b>IN</b> から右の <b>OUT</b> まで水路をつなごう。</p>
      <p>⌨ 矢印キーでカーソル移動、<b>スペース/Enter</b>で回転もできるよ。</p>
      <p>制限時間内につながらないとライフが1減る。ライフは3つ。</p>
      <p>まれに現れる <span style="color:var(--star)">★ボーナスパイプ</span> まで一緒に繋げると得点3倍!</p>
      <p>レベルが進むほど盤面が広がり、時間も短くなる一発勝負。</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <!-- リザルト画面: 必須要件2 -->
    <div class="overlay hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>

  <div class="timerBarWrap"><div class="timerBar" id="timerBar"></div></div>

  <div class="hud">
    <span id="scoreLabel">SCORE 0</span>
    <span id="levelLabel">LEVEL 1</span>
    <span class="lives" id="livesLabel">♥♥♥</span>
  </div>
  <div class="hint">タップでパイプ回転 / 矢印キー+スペースでも操作可</div>
</div>

<div class="vpadArea">
  <button type="button" class="vpadToggle" id="vpadToggle">🎮 コントローラ 表示/非表示</button>
  <div class="vpadPanel hidden" id="vpadWrap">
    <div class="vpad">
      <button type="button" class="vpadBtn vpadUp" data-key="ArrowUp">▲</button>
      <button type="button" class="vpadBtn vpadLeft" data-key="ArrowLeft">◀</button>
      <button type="button" class="vpadBtn vpadRight" data-key="ArrowRight">▶</button>
      <button type="button" class="vpadBtn vpadDown" data-key="ArrowDown">▼</button>
    </div>
    <button type="button" class="vpadR" id="vpadR">R</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
