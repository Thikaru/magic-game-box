<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タイプでGO!そりレース — DAILY GAMES</title>
<style>
  :root { --bg1:#0f2744; --bg2:#1d4e7a; --accent:#38bdf8; --warn:#fb923c; --ok:#4ade80; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:#fff; min-height:100vh; overflow-x:hidden; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  header a { color:#fff; text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--accent); min-height:44px; display:inline-flex; align-items:center; white-space:nowrap; }
  h1 { font-size:1.05rem; }
  .stage { position:relative; background:#0b1d33; border:4px solid var(--accent); border-radius:14px; padding:12px; min-height:540px; }
  .hud { display:flex; justify-content:space-between; font-weight:700; font-size:.92rem; margin-bottom:8px; }
  .track { background:#e8f6ff; border-radius:10px; padding:6px 6px 6px 6px; margin-bottom:12px; }
  .lane { position:relative; height:34px; margin:4px 0; border-bottom:2px dashed #b6d8ee; }
  .lane .goal { position:absolute; right:0; top:0; height:100%; width:6px; background:repeating-linear-gradient(0deg,#222 0 6px,#fff 6px 12px); }
  .lane .rider { position:absolute; top:0; left:0; font-size:1.5rem; line-height:34px; transition:none; }
  .lane.me { background:rgba(56,189,248,.18); border-radius:6px; }
  .lane .nm { position:absolute; left:4px; top:0; font-size:.65rem; color:#456; line-height:34px; }
  .msg { text-align:center; min-height:1.6em; color:#fde68a; font-weight:700; font-size:.95rem; margin-bottom:6px; }
  .card { background:#12304f; border-radius:12px; padding:10px; text-align:center; margin-bottom:12px; }
  .card .emo { font-size:3rem; line-height:1.15; }
  .card .kana { font-size:1.2rem; font-weight:700; }
  .card .rom { font-size:2rem; font-weight:800; letter-spacing:.18em; font-family:ui-monospace,Menlo,monospace; margin-top:4px; }
  .rom .done { color:var(--ok); } .rom .next { color:#fff; border-bottom:4px solid var(--accent); } .rom .todo { color:#6c8ba8; }
  .card.shake { animation:shake .25s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .pad { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .key { min-height:52px; font-family:inherit; font-size:1.5rem; font-weight:800; color:#0b1d33; background:#e8f6ff; border:0; border-radius:10px; box-shadow:0 4px 0 #7fb3d3; cursor:pointer; touch-action:manipulation; text-transform:uppercase; }
  .key:active { transform:translateY(2px); box-shadow:0 2px 0 #7fb3d3; }
  .turbo { margin-top:10px; font-size:.85rem; min-height:1.4em; color:var(--warn); font-weight:700; text-align:center; }
  .overlay { position:absolute; inset:0; border-radius:10px; background:rgba(11,29,51,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; }
  .overlay h2 { font-size:1.4rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--accent); color:#06283d; border:0; border-radius:10px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #1b7aa6; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #1b7aa6; }
  .big { font-size:4rem; font-weight:800; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛷 タイプでGO!そりレース</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="stage">
    <div class="hud">
      <span id="timeLabel">⏱ 0.0秒</span>
      <span id="comboLabel">🔥 コンボ 0</span>
    </div>
    <div class="track" id="track"></div>
    <div class="msg" id="msg">&nbsp;</div>
    <div class="card" id="card">
      <div class="emo" id="emo">🐱</div>
      <div class="kana" id="kana"></div>
      <div class="rom" id="rom"></div>
    </div>
    <div class="pad" id="pad"></div>
    <div class="turbo" id="turbo">&nbsp;</div>

    <div class="overlay" id="intro">
      <h2>🛷 あそびかた</h2>
      <p>ゴールまで<b>ライバル3ひき</b>とそりレース!<br>出てきたことばを<b>ローマ字</b>で打つと、そりが進むよ。</p>
      <p>⌨️ キーボードで打つ / 📱 下のボタンをタップ<br>まちがえると少しもどされて、コンボも切れちゃう。</p>
      <p>🔥 ノーミスで打ちきるとボーナス前進!<br>ライバルのすぐうしろなら<b>スリップストリーム</b>でさらに加速!</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="count"><div class="big" id="countNum">3</div></div>

    <div class="overlay hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
