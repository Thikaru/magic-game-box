<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>いちどだけ!ひびわれフロア脱出 — DAILY GAMES</title>
<style>
  :root { --bg:#1d1a2b; --acc:#ffd24a; --paper:#fffdf5; --ink:#1c1c28; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:var(--bg); color:var(--paper); min-height:100vh; overflow-x:hidden; }
  .wrap { max-width:440px; margin:0 auto; padding:8px 12px 28px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--acc); padding:12px 0; }
  h1 { color:var(--acc); font-size:1.05rem; }
  .hud { display:flex; justify-content:space-between; font-weight:700; margin-bottom:6px; font-size:.95rem; }
  .stage { position:relative; }
  #board { display:grid; gap:3px; padding:6px; border:4px solid var(--acc); border-radius:12px; background:#0d1a33; touch-action:none; min-height:430px; align-content:start; user-select:none; -webkit-user-select:none; }
  .c { aspect-ratio:1; min-height:44px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; position:relative; transition:background .15s; }
  .c.water { background:#12306b; }
  .c.floor { background:#c9a66b; box-shadow:inset 0 -3px 0 #98763f; }
  .c.cur { background:#e7c98f; }
  .c.hole { background:#05070f; }
  .c.hint { outline:3px solid rgba(255,210,74,.7); outline-offset:-3px; }
  .msg { min-height:1.6em; text-align:center; font-weight:700; margin:8px 0 0; font-size:.95rem; color:var(--acc); }
  .overlay { position:absolute; inset:0; border-radius:10px; background:rgba(29,26,43,.96); display:flex; flex-direction:column; align-items:center; text-align:center; padding:18px 14px; overflow-y:auto; z-index:5; }
  .overlay h2 { color:var(--acc); font-size:1.3rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.9rem; margin-bottom:6px; }
  .btn { margin-top:12px; font-family:inherit; font-size:1.05rem; font-weight:700; background:var(--acc); color:var(--ink); border:0; border-radius:10px; padding:0 26px; min-height:48px; box-shadow:0 4px 0 #b8912a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 2px 0 #b8912a; }
  .btn.sub { background:#4a3f7a; color:#fff; box-shadow:0 4px 0 #2e2650; padding:0 16px; font-size:.95rem; }
  .row { display:flex; gap:10px; justify-content:center; margin-top:10px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🕳️ いちどだけ!ひびわれフロア</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="hud"><span id="stg">ステージ 1/5</span><span id="key">🔑 まだ</span><span id="hearts">❤️❤️❤️</span></div>
  <div class="stage">
    <div id="board"></div>
    <div class="overlay" id="intro">
      <h2>🕳️ あそびかた</h2>
      <p>ふるい遺跡の床はもろい!<b>1度ふんだマスは、はなれると くずれて穴</b>になるよ。</p>
      <p>🔑カギを取ってから、🚪とびらに着けばステージクリア。同じマスは2度と通れない!</p>
      <p>行き止まりや穴におちるとハートが1つへり、同じ配置でやりなおし。ハート0でゲームオーバー。<b>全5ステージ</b>を突破しよう。</p>
      <p>⌨ 矢印キー / WASD ・ 📱 となりのマスをタップ or 盤面をスワイプ</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="result">
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="row"><button class="btn sub" id="resetBtn">↺ このステージをやりなおす(ハート-1)</button></div>
</div>
<script src="game.js"></script>
</body>
</html>
