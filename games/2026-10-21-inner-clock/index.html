<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きえる時計!体内時計チャレンジ — DAILY GAMES</title>
<style>
  :root { --bg:#14213d; --gold:#fcca46; --mint:#7ae0c3; --ink:#14213d; --paper:#fffdf5; --red:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#14213d,#0b1226); color:var(--paper); min-height:100vh; overflow-x:hidden; }
  .wrap { max-width:520px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; min-height:44px; display:inline-flex; align-items:center; border-bottom:2px dotted var(--gold); }
  h1 { color:var(--gold); font-size:1.05rem; }
  .stage { position:relative; background:#1d2f5a; border:4px solid var(--gold); border-radius:16px; min-height:470px; padding:16px; text-align:center; }
  .info { display:flex; justify-content:space-between; font-weight:700; color:var(--mint); }
  .target { margin-top:18px; font-size:1rem; }
  .target b { display:block; font-size:2.6rem; color:var(--gold); line-height:1.2; }
  .clock { margin:18px auto 6px; width:230px; height:230px; border-radius:50%; border:8px solid var(--paper); background:#0b1226; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; font-size:3rem; font-weight:700; transition:border-color .2s; }
  .clock.hide { border-color:#4a5a86; color:#4a5a86; font-size:4rem; }
  .clock.fake { border-color:var(--red); }
  .note { min-height:1.6em; font-size:.9rem; color:var(--red); }
  .result { min-height:3.2em; margin-top:6px; font-size:1.05rem; line-height:1.6; }
  button { font-family:inherit; cursor:pointer; touch-action:manipulation; }
  .main { width:100%; min-height:64px; font-size:1.4rem; font-weight:700; background:var(--gold); color:var(--ink); border:0; border-radius:14px; box-shadow:0 5px 0 #b48a1d; margin-top:6px; }
  .main:active { transform:translateY(3px); box-shadow:0 2px 0 #b48a1d; }
  .overlay { position:absolute; inset:0; background:rgba(11,18,38,.96); border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; }
  .overlay.hidden { display:none; }
  .overlay h2 { color:var(--gold); font-size:1.6rem; margin-bottom:12px; }
  .overlay p { line-height:1.8; font-size:.95rem; margin-bottom:6px; }
  .overlay .btn { margin-top:16px; min-height:48px; padding:0 40px; font-size:1.1rem; font-weight:700; background:var(--gold); color:var(--ink); border:0; border-radius:12px; box-shadow:0 4px 0 #b48a1d; }
  .big { font-size:2.4rem; color:var(--gold); font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="../../index.html">← トップへ</a>
    <h1>きえる時計!体内時計チャレンジ</h1>
  </header>
  <div class="stage">
    <div class="info"><span id="round">ラウンド 1/5</span><span id="score">0 pt</span></div>
    <div class="target">この時間ぴったりで止めよう<b id="target">3.00 秒</b></div>
    <div class="clock" id="clock">0.00</div>
    <div class="note" id="note"></div>
    <div class="result" id="result"></div>
    <button class="main" id="act">スタート</button>

    <div class="overlay" id="intro">
      <h2>⏱ 体内時計チャレンジ</h2>
      <p>出された秒数ぴったりで「ストップ」を押そう。<br>時計は最初の数秒だけ見えて、そのあとは<b>消えてしまう</b>!<br>心の中で数えて止めよう。</p>
      <p>👀 ラウンドが進むほど、見える時間は短くなる<br>🌀 とちゅうで「ニセ時計」(はやおくり)が出るので注意</p>
      <p>操作:ボタンをタップ / スペースキー(またはEnter)</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="end">
      <h2 id="endTitle">けっか</h2>
      <div class="big" id="endScore">0 / 500</div>
      <p id="endRank"></p>
      <p id="endDetail"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
