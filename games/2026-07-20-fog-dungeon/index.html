<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>まよいの地下迷宮 — DAILY GAMES</title>
<style>
  :root { --bg1:#1b1430; --bg2:#0a0714; --panel:#221a3d; --line:#5b3fb8; --torch:#ffb84d; --gold:#ffd166; --hp:#ff5d7a; --safe:#6be6b0; --danger:#ff5d5d; --ink:#0a0714; --paper:#f1e9ff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { overflow-x:hidden; }
  body { font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',system-ui,sans-serif; background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2)); color:var(--paper); min-height:100vh; }
  .wrap { max-width:420px; margin:0 auto; padding:14px 12px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; flex-wrap:wrap; gap:6px; }
  header a { color:var(--paper); text-decoration:none; font-size:.85rem; border-bottom:2px dotted var(--torch); }
  h1 { color:var(--torch); font-size:1.05rem; letter-spacing:.02em; }

  .stage { position:relative; border:3px solid var(--line); border-radius:14px; background:var(--panel); padding:10px; }

  .hud { display:flex; justify-content:space-between; align-items:center; font-size:.8rem; margin-bottom:8px; gap:6px; flex-wrap:wrap; }
  .hud .hp { color:var(--hp); font-weight:bold; }
  .hud .floor { color:var(--safe); font-weight:bold; }
  .hud .gold { color:var(--gold); font-weight:bold; }

  canvas { display:block; width:100%; height:auto; aspect-ratio:1/1; border-radius:10px; background:#0d0920; touch-action:none; }

  .flashMsg { text-align:center; min-height:1.4em; font-weight:bold; font-size:.92rem; margin-top:8px; }
  .flashMsg.ok { color:var(--safe); }
  .flashMsg.bonus { color:var(--gold); }
  .flashMsg.bad { color:var(--danger); }

  .footNote { text-align:center; font-size:.72rem; opacity:.65; margin-top:6px; }


  .overlay { position:absolute; inset:6px; border-radius:10px; background:rgba(10,7,20,.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; overflow-y:auto; }
  .overlay h2 { color:var(--torch); font-size:1.3rem; margin-bottom:12px; }
  .overlay p { line-height:1.8; font-size:.85rem; margin-bottom:8px; }
  .overlay .btn { margin-top:16px; font-size:1.05rem; background:var(--torch); color:var(--ink); border:0; border-radius:10px; padding:14px 36px; min-height:48px; box-shadow:0 5px 0 #b5762a; cursor:pointer; font-weight:bold; }
  .overlay .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b5762a; }
  .hidden { display:none; }
  .musicBar { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:.85rem; flex-wrap:wrap; }
  .musicBar select { font-family:inherit; font-size:.9rem; min-height:44px; border-radius:8px; border:1px solid #ffd23f; background:#fffdf5; color:#1c1c28; padding:0 8px; }
  .musicToggle { font-family:inherit; font-size:.85rem; color:#fffdf5; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.45); border-radius:8px; padding:0 12px; min-height:44px; cursor:pointer; }
  .vpadArea { max-width:560px; margin:14px auto 0; padding:0 12px; display:flex;
    flex-direction:column; align-items:center; gap:10px; }
  .vpadToggle { font-family:inherit; font-size:.85rem; color:#fff; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:0 14px; min-height:40px; cursor:pointer; }
  .vpadPanel { display:flex; align-items:center; justify-content:center; gap:28px; width:100%;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); border-radius:16px; padding:16px; }
  .vpadPanel.hidden { display:none; }
  .vpad { position:relative; width:132px; height:132px; flex-shrink:0; }
  .vpadBtn { position:absolute; width:44px; height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  .vpadUp    { left:44px; top:0; }
  .vpadLeft  { left:0;    top:44px; }
  .vpadRight { left:88px; top:44px; }
  .vpadDown  { left:44px; top:88px; }
  .vpadR { width:60px; height:60px; flex-shrink:0; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,210,63,.9); color:#1c1c28; font-weight:700; font-size:1.1rem; touch-action:none;
    user-select:none; -webkit-user-select:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>まよいの地下迷宮</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="musicBar">
    <button type="button" class="musicToggle" id="musicToggle">🔊 BGM ON</button>
    <label for="musicSelect">🎵 BGM</label>
    <select id="musicSelect">
      <option value="pop">ポップ</option>
      <option value="speed">スピード</option>
      <option value="dark">ダーク</option>
      <option value="limit">リミット</option>
    </select>
  </div>

  <div class="stage">
    <div class="hud">
      <span class="hp" id="hpLabel">HP 20/20</span>
      <span class="floor" id="floorLabel">B1F</span>
      <span class="gold" id="goldLabel">💰 0</span>
    </div>

    <canvas id="game" width="352" height="352"></canvas>

    <div class="flashMsg" id="flashMsg"></div>

    <div class="footNote">タップ移動先へ / スワイプ / ⌨ 矢印・WASD キー / 画面下のコントローラ</div>

    <!-- 説明画面: ここから開始する(必須要件1) -->
    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>霧につつまれた地下迷宮を1歩ずつ探索するローグライク。<br>
        隣のマスへ<b>タップ</b>・<b>スワイプ</b>・<b>矢印/WASDキー</b>で移動しよう。</p>
      <p><span style="color:#ff5d5d">👹モンスター</span>にぶつかると自動で戦闘。
        倒せば先へ進めるが、負けるとダメージを受けて足止めされる。</p>
      <p><span style="color:#ffd166">🎁宝箱</span>は開けるまで中身が分からない。
        ちからの薬・強化・呪いのワナ…運だめし!</p>
      <p><span style="color:#6be6b0">🔻階段</span>を見つけて潜るほど、
        モンスターは増えて強くなる。HPが0になったら終了。</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <!-- リザルト画面: 何度でもやり直せる(必須要件2) -->
    <div class="overlay hidden" id="result">
      <h2 id="resultTitle">力尽きた…</h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>

<div class="vpadArea">
  <button type="button" class="vpadToggle" id="vpadToggle">🎮 コントローラ 表示/非表示</button>
  <div class="vpadPanel hidden" id="vpadWrap">
    <div class="vpad">
      <button type="button" class="vpadBtn vpadUp" data-key="ArrowUp">▲</button>
      <button type="button" class="vpadBtn vpadLeft" data-key="ArrowLeft">◀</button>
      <button type="button" class="vpadBtn vpadRight" data-key="ArrowRight">▶</button>
      <button type="button" class="vpadBtn vpadDown" data-key="ArrowDown">▼</button>
    </div>
    <button type="button" class="vpadR" id="vpadR">R</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
