<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まねっこ!リズムたいこ — DAILY GAMES</title>
<style>
  :root { --brown:#3b2a4a; --accent:#ff6f91; --gold:#ffc93c; --teal:#2ec4b6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:linear-gradient(180deg,#2a1b3d,#44318d); color:#fff; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  header a { color:#fff; text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--gold); min-height:44px; display:inline-flex; align-items:center; white-space:nowrap; }
  h1 { font-size:1.05rem; }
  .stage { position:relative; background:#231635; border:4px solid var(--accent); border-radius:14px; padding:12px; min-height:480px; }
  .hud { display:flex; justify-content:space-between; font-weight:700; font-size:.95rem; margin-bottom:8px; }
  .msg { text-align:center; font-weight:700; font-size:1.05rem; min-height:2.6em; margin-bottom:8px; line-height:1.4; }
  .steps { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; margin-bottom:12px; }
  .st { aspect-ratio:1; border-radius:50%; background:#3d2b57; display:flex; align-items:center; justify-content:center; font-size:.8rem; color:#8c7aa8; transition:background .08s; }
  .st.hit { background:#5b4580; color:#fff; }
  .st.hit.hidden-pat { background:#3d2b57; color:#8c7aa8; }
  .st.lit { background:var(--gold); color:var(--brown); transform:scale(1.15); }
  .drum { display:block; width:100%; min-height:190px; border:0; border-radius:24px; background:radial-gradient(circle at 50% 35%,#ff9db4,var(--accent)); box-shadow:0 8px 0 #b3405f; font-size:5rem; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; transition:transform .05s; }
  .drum.hitfx { transform:translateY(5px) scale(.97); box-shadow:0 3px 0 #b3405f; }
  .drum.listen { background:radial-gradient(circle at 50% 35%,#9fe8e0,var(--teal)); box-shadow:0 8px 0 #1b8a80; }
  .drum:disabled { cursor:default; }
  .row { display:flex; gap:8px; margin-top:14px; }
  .sub { flex:1; min-height:48px; font-family:inherit; font-size:.95rem; font-weight:700; color:var(--brown); background:#ffe7a3; border:0; border-radius:12px; box-shadow:0 4px 0 #c9a63f; cursor:pointer; }
  .sub:disabled { opacity:.4; }
  .overlay { position:absolute; inset:0; border-radius:10px; background:rgba(35,22,53,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; }
  .overlay h2 { font-size:1.45rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #b3405f; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #b3405f; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🥁 まねっこ!リズムたいこ</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="stage">
    <div class="hud">
      <span id="roundLabel">ラウンド 1/5</span>
      <span id="lifeLabel">❤️❤️❤️</span>
      <span id="scoreLabel">0点</span>
    </div>
    <div class="msg" id="msg">&nbsp;</div>
    <div class="steps" id="steps"></div>
    <button type="button" class="drum" id="drum" disabled>🥁</button>
    <div class="row">
      <button type="button" class="sub" id="replayBtn">👂 もういちどきく(1回)</button>
    </div>

    <div class="overlay" id="intro">
      <h2>🥁 あそびかた</h2>
      <p>おてほんのリズムを<b>よく聞いて</b>、<br>同じリズムで<b>たいこを叩こう</b>!</p>
      <p>1つ目はいつ叩いてもOK。<br>2つ目からは<b>間隔(ま)</b>がそっくりだとせいこう。</p>
      <p>ラウンド3からは<b>耳だけ</b>!リズムの図が消えるよ。</p>
      <p>ずれたら❤️が減る。❤️がなくなるとおしまい。全5ラウンド。</p>
      <p>🔊 音が出ます。⌨ スペースキーでも叩けるよ</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
