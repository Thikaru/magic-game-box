<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ブロックくずし — DAILY GAMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --carpet:#1a2470; --marquee:#ffd23f; --coin:#ff5da2; --crt:#4dd8e6; --paper:#fffdf5; --ink:#1c1c28; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'M PLUS Rounded 1c',system-ui,sans-serif; background:linear-gradient(180deg,#1a2470,#121a55); color:var(--paper); min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:16px 12px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  header a { color:var(--paper); text-decoration:none; font-size:.85rem; border-bottom:2px dotted var(--coin); }
  h1 { font-family:'DotGothic16',monospace; color:var(--marquee); font-size:1.3rem; }
  .stage { position:relative; }
  canvas { display:block; width:100%; border:4px solid var(--marquee); border-radius:12px; background:#0d1340; touch-action:none; }
  .overlay { position:absolute; inset:4px; border-radius:8px; background:rgba(13,19,64,.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .overlay h2 { font-family:'DotGothic16',monospace; color:var(--marquee); font-size:1.6rem; margin-bottom:14px; }
  .overlay p { line-height:1.9; font-size:.95rem; margin-bottom:8px; }
  .overlay .btn { margin-top:18px; font-family:'DotGothic16',monospace; font-size:1.1rem; background:var(--marquee);
    color:var(--ink); border:0; border-radius:10px; padding:12px 36px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .overlay .btn:hover { transform:translateY(2px); box-shadow:0 3px 0 #b8912a; }
  .hidden { display:none; }
  .hud { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-family:'DotGothic16',monospace; color:var(--crt); margin-top:10px; }
  .effects { font-size:.8rem; opacity:.9; letter-spacing:.05em; }
  header { flex-wrap:wrap; row-gap:6px; }
  .musicBar { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:.85rem; }
  .musicBar select { font-family:'M PLUS Rounded 1c',sans-serif; font-size:.9rem; min-height:44px; border-radius:8px;
    border:1px solid var(--marquee); background:var(--paper); color:var(--ink); padding:0 8px; }
  .musicToggle { font-family:'M PLUS Rounded 1c',sans-serif; font-size:.85rem; color:var(--paper); background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:0 12px; min-height:44px; cursor:pointer; }
  .vpadArea { max-width:560px; margin:14px auto 0; padding:0 12px; display:flex;
    flex-direction:column; align-items:center; gap:10px; }
  .vpadToggle { font-family:inherit; font-size:.85rem; color:#fff; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:0 14px; min-height:40px; cursor:pointer; }
  .vpadPanel { display:flex; align-items:center; justify-content:center; gap:28px; width:100%;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); border-radius:16px; padding:16px; }
  .vpadPanel.hidden { display:none; }
  .vpad { position:relative; width:132px; height:132px; flex-shrink:0; }
  .vpadBtn { position:absolute; width:44px; height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  .vpadUp    { left:44px; top:0; }
  .vpadLeft  { left:0;    top:44px; }
  .vpadRight { left:88px; top:44px; }
  .vpadDown  { left:44px; top:88px; }
  .vpadR { width:60px; height:60px; flex-shrink:0; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,210,63,.9); color:#1c1c28; font-weight:700; font-size:1.1rem; touch-action:none;
    user-select:none; -webkit-user-select:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ブロックくずし</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="musicBar">
    <button type="button" class="musicToggle" id="musicToggle">🔊 BGM ON</button>
    <label for="musicSelect">🎵 BGM</label>
    <select id="musicSelect">
      <option value="pop">ポップ</option>
      <option value="speed">スピード</option>
      <option value="dark">ダーク</option>
      <option value="limit">リミット</option>
    </select>
  </div>

  <div class="stage">
    <canvas id="game" width="480" height="600"></canvas>

    <!-- 説明画面: ここから開始する(必須要件1) -->
    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>パドルでボールを打ち返して<br>ブロックを全部こわそう。</p>
      <p>🖱 マウス / 👆 タッチ / ⌨ ←→キー でパドル移動</p>
      <p>ボールを落とすと残機が1へる。残機は3つ。</p>
      <p>ブロックを壊すと、たまにアイテムが降ってくる。<br>
        パドルで受け止めよう。<br>
        <b>W</b>=パドル拡大 / <b>M</b>=マルチボール / <b>S</b>=スローボール</p>
      <p>全部のブロックを壊すと次のレベルへ進む。<br>
        レベルが上がるほどボールが速く、段数も増えていく。<br>
        残機がなくなるまで何レベル進めるか挑戦しよう!</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <!-- リザルト画面: 何度でもやり直せる(必須要件2) -->
    <div class="overlay hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>

  <div class="hud">
    <span id="scoreLabel">SCORE 0</span>
    <span class="effects" id="effectsLabel"></span>
    <span id="livesLabel">♥♥♥</span>
  </div>
</div>

<div class="vpadArea">
  <button type="button" class="vpadToggle" id="vpadToggle">🎮 コントローラ 表示/非表示</button>
  <div class="vpadPanel hidden" id="vpadWrap">
    <div class="vpad">
      <button type="button" class="vpadBtn vpadUp" data-key="ArrowUp">▲</button>
      <button type="button" class="vpadBtn vpadLeft" data-key="ArrowLeft">◀</button>
      <button type="button" class="vpadBtn vpadRight" data-key="ArrowRight">▶</button>
      <button type="button" class="vpadBtn vpadDown" data-key="ArrowDown">▼</button>
    </div>
    <button type="button" class="vpadR" id="vpadR">R</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
