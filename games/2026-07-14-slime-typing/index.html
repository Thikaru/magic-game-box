<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スライムそだてタイピング — DAILY GAMES</title>
<style>
  :root { --carpet:#1a2470; --marquee:#ffd23f; --coin:#ff5da2; --crt:#4dd8e6; --paper:#fffdf5; --ink:#1c1c28; --slime:#57e389; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x:hidden; }
  body { font-family:'Hiragino Maru Gothic ProN','M PLUS Rounded 1c',system-ui,sans-serif; background:linear-gradient(180deg,#1a2470,#121a55); color:var(--paper); min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:14px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; gap:8px; flex-wrap:wrap; }
  header a { color:var(--paper); text-decoration:none; font-size:.85rem; border-bottom:2px dotted var(--coin); white-space:nowrap; }
  h1 { font-family:monospace; color:var(--marquee); font-size:1.15rem; letter-spacing:.02em; }
  .stage { position:relative; border:4px solid var(--marquee); border-radius:14px; background:#0d1340; padding:14px; min-height:420px; }
  .overlay { position:absolute; inset:4px; border-radius:10px; background:rgba(13,19,64,.96);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:22px 18px; z-index:5; }
  .overlay h2 { font-family:monospace; color:var(--marquee); font-size:1.4rem; margin-bottom:12px; }
  .overlay p { line-height:1.8; font-size:.92rem; margin-bottom:8px; }
  .overlay .btn { margin-top:16px; font-family:monospace; font-size:1.1rem; background:var(--marquee);
    color:var(--ink); border:0; border-radius:10px; padding:12px 36px; box-shadow:0 5px 0 #b8912a; cursor:pointer; min-height:44px; }
  .overlay .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b8912a; }
  .hidden { display:none !important; }
  .hud { display:flex; justify-content:space-between; font-family:monospace; color:var(--crt); font-size:.95rem; margin-bottom:6px; }
  .hud b { color:var(--marquee); }
  .stagebox { display:flex; flex-direction:column; align-items:center; gap:8px; min-height:150px; justify-content:center; }
  #slime { font-size:3.2rem; transition:transform .25s ease; display:inline-block; }
  #slime.miss { animation:shake .3s; }
  @keyframes shake { 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-6px) } 75%{ transform:translateX(6px) } }
  .word-kana { font-size:1.1rem; opacity:.85; margin-top:4px; min-height:1.4em; }
  .word-romaji { font-family:monospace; font-size:1.6rem; letter-spacing:.06em; margin-top:6px; min-height:2em; }
  .word-romaji span { opacity:.4; }
  .word-romaji span.typed { color:var(--slime); opacity:1; }
  .word-romaji span.current { color:var(--marquee); opacity:1; text-decoration:underline; }
  .bonus-tag { color:var(--coin); font-weight:bold; }
  .vkb-toggle { display:block; margin:10px auto 4px; font-family:monospace; font-size:.85rem; background:rgba(255,255,255,.1);
    color:var(--paper); border:1px solid rgba(255,255,255,.3); border-radius:8px; padding:8px 14px; min-height:44px; cursor:pointer; }
  .vkb { margin-top:6px; }
  .vkb-row { display:flex; gap:4px; margin-bottom:4px; }
  .vkb-row button { flex:1; min-width:0; min-height:44px; font-family:monospace; font-size:1rem; background:rgba(255,255,255,.12);
    color:var(--paper); border:1px solid rgba(255,255,255,.25); border-radius:6px; cursor:pointer; }
  .vkb-row button:active { background:var(--marquee); color:var(--ink); }
  .result-score { font-family:monospace; color:var(--marquee); font-size:2rem; margin:6px 0; }
  .musicBar { display:flex; align-items:center; gap:8px; margin:0 0 10px; font-size:.85rem; flex-wrap:wrap; }
  .musicBar select { font-family:inherit; font-size:.9rem; min-height:44px; border-radius:8px; border:1px solid #ffd23f; background:#fffdf5; color:#1c1c28; padding:0 8px; }
  .musicToggle { font-family:inherit; font-size:.85rem; color:#fffdf5; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.45); border-radius:8px; padding:0 12px; min-height:44px; cursor:pointer; }
  .vpadArea { max-width:560px; margin:14px auto 0; padding:0 12px; display:flex;
    flex-direction:column; align-items:center; gap:10px; }
  .vpadToggle { font-family:inherit; font-size:.85rem; color:#fff; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:0 14px; min-height:40px; cursor:pointer; }
  .vpadPanel { display:flex; align-items:center; justify-content:center; gap:28px; width:100%;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); border-radius:16px; padding:16px; }
  .vpadPanel.hidden { display:none; }
  .vpad { position:relative; width:132px; height:132px; flex-shrink:0; }
  .vpadBtn { position:absolute; width:44px; height:44px; border-radius:10px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.12); color:#fff; font-size:1.1rem; display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  .vpadUp    { left:44px; top:0; }
  .vpadLeft  { left:0;    top:44px; }
  .vpadRight { left:88px; top:44px; }
  .vpadDown  { left:44px; top:88px; }
  .vpadR { width:60px; height:60px; flex-shrink:0; border-radius:50%; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,210,63,.9); color:#1c1c28; font-weight:700; font-size:1.1rem; touch-action:none;
    user-select:none; -webkit-user-select:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>スライムそだてタイピング</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="musicBar">
    <button type="button" class="musicToggle" id="musicToggle">🔊 BGM ON</button>
    <label for="musicSelect">🎵 BGM</label>
    <select id="musicSelect">
      <option value="pop">ポップ</option>
      <option value="speed">スピード</option>
      <option value="dark">ダーク</option>
      <option value="limit">リミット</option>
    </select>
  </div>

  <div class="stage" id="stage">
    <div class="hud">
      <span>⏱ <b id="timeLabel">60</b></span>
      <span>SCORE <b id="scoreLabel">0</b></span>
      <span>コンボ <b id="comboLabel">0</b></span>
    </div>

    <div class="stagebox">
      <div id="slime">🟢</div>
      <div class="word-kana" id="wordKana"></div>
      <div class="word-romaji" id="wordRomaji"></div>
    </div>

    <button class="vkb-toggle" id="vkbToggle">⌨️ キーボード 表示/非表示</button>
    <div class="vkb hidden" id="vkb">
      <div class="vkb-row" data-row="qwertyuiop"></div>
      <div class="vkb-row" data-row="asdfghjkl"></div>
      <div class="vkb-row" data-row="zxcvbnm"></div>
    </div>

    <!-- 説明画面: ここから開始する(必須要件1) -->
    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>出てきた単語のローマ字を60秒以内にどんどん入力しよう。<br>
        正解するたびスライムが育つ!ミスタイプすると少し縮んでしまう。</p>
      <p>⌨ キーボード入力、またはスマホは<br>「⌨️ キーボード 表示/非表示」のボタンでタップ入力できる。</p>
      <p>コンボがつながるほど<span class="bonus-tag">✨ボーナス単語</span>が出やすくなる。<br>
        終盤は長い単語が増えるので、集中力を切らさずに一気に育てよう!</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <!-- リザルト画面: 何度でもやり直せる(必須要件2) -->
    <div class="overlay hidden" id="result">
      <h2>タイムアップ!</h2>
      <p>スライムLv <b id="finalLevel"></b></p>
      <div class="result-score" id="finalScore"></div>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>

<div class="vpadArea">
  <button type="button" class="vpadToggle" id="vpadToggle">🎮 コントローラ 表示/非表示</button>
  <div class="vpadPanel hidden" id="vpadWrap">
    <div class="vpad">
      <button type="button" class="vpadBtn vpadUp" data-key="ArrowUp">▲</button>
      <button type="button" class="vpadBtn vpadLeft" data-key="ArrowLeft">◀</button>
      <button type="button" class="vpadBtn vpadRight" data-key="ArrowRight">▶</button>
      <button type="button" class="vpadBtn vpadDown" data-key="ArrowDown">▼</button>
    </div>
    <button type="button" class="vpadR" id="vpadR">R</button>
  </div>
</div>

<script>
(function(){
  var NORMAL_WORDS = [
    {kana:"りんご", romaji:"ringo"},
    {kana:"めろん", romaji:"meron"},
    {kana:"すいか", romaji:"suika"},
    {kana:"ぶどう", romaji:"budou"},
    {kana:"みかん", romaji:"mikan"},
    {kana:"いちご", romaji:"ichigo"},
    {kana:"ばなな", romaji:"banana"},
    {kana:"もも", romaji:"momo"},
    {kana:"なし", romaji:"nashi"},
    {kana:"かき", romaji:"kaki"},
    {kana:"くり", romaji:"kuri"},
    {kana:"うめ", romaji:"ume"}
  ];
  var BONUS_WORDS = [
    {kana:"すいかわり", romaji:"suikawari"},
    {kana:"ぶどうしゅ", romaji:"budoushu"},
    {kana:"ごちそうさま", romaji:"gochisousama"},
    {kana:"ぱいなっぷる", romaji:"painappuru"},
    {kana:"おおもりごはん", romaji:"oomorigohan"}
  ];
  var COMBO_MILESTONE = 5;
  var GAME_SECONDS = 60;

  var timeLeft, score, growth, combo, currentWord, typedIndex, timerId, running, elapsed;

  var slimeEl = document.getElementById('slime');
  var wordKanaEl = document.getElementById('wordKana');
  var wordRomajiEl = document.getElementById('wordRomaji');
  var timeLabel = document.getElementById('timeLabel');
  var scoreLabel = document.getElementById('scoreLabel');
  var comboLabel = document.getElementById('comboLabel');
  var introEl = document.getElementById('intro');
  var resultEl = document.getElementById('result');
  var finalLevelEl = document.getElementById('finalLevel');
  var finalScoreEl = document.getElementById('finalScore');
  var vkb = document.getElementById('vkb');
  var vkbToggle = document.getElementById('vkbToggle');

  function buildKeyboard(){
    var rows = vkb.querySelectorAll('.vkb-row');
    rows.forEach(function(row){
      var letters = row.getAttribute('data-row').split('');
      letters.forEach(function(ch){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = ch;
        btn.addEventListener('click', function(){ handleChar(ch); });
        row.appendChild(btn);
      });
    });
  }
  buildKeyboard();

  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    vkb.classList.remove('hidden');
  }
  vkbToggle.addEventListener('click', function(){ vkb.classList.toggle('hidden'); });

  function updateHud(){
    timeLabel.textContent = timeLeft;
    scoreLabel.textContent = score;
    comboLabel.textContent = combo;
  }

  function updateSlime(){
    var level = Math.floor(growth / 20);
    var scale = Math.min(1 + level * 0.18, 4.2);
    slimeEl.style.transform = 'scale(' + scale + ')';
  }

  function slimeLevel(){ return Math.floor(growth / 20) + 1; }

  function renderWord(){
    wordKanaEl.innerHTML = currentWord.bonus
      ? currentWord.kana + ' <span class="bonus-tag">✨ボーナス</span>'
      : currentWord.kana;
    wordRomajiEl.innerHTML = '';
    for (var i = 0; i < currentWord.romaji.length; i++) {
      var span = document.createElement('span');
      span.textContent = currentWord.romaji[i];
      if (i < typedIndex) span.className = 'typed';
      else if (i === typedIndex) span.className = 'current';
      wordRomajiEl.appendChild(span);
    }
  }

  function pickWord(bonus){
    var bank = bonus ? BONUS_WORDS : NORMAL_WORDS;
    var w;
    do {
      w = bank[Math.floor(Math.random() * bank.length)];
    } while (bank.length > 1 && currentWord && w.kana === currentWord.kana);
    currentWord = { kana: w.kana, romaji: w.romaji, bonus: !!bonus };
    typedIndex = 0;
    renderWord();
  }

  function bonusMilestone(){
    // 終盤になるほどボーナス(長い)単語が出やすくなる
    return Math.max(2, COMBO_MILESTONE - Math.floor(elapsed / 20));
  }

  function nextWord(){
    var bonus = combo > 0 && combo % bonusMilestone() === 0;
    pickWord(bonus);
  }

  function onWordComplete(){
    var len = currentWord.romaji.length;
    if (currentWord.bonus) {
      score += len * 30;
      growth += len * 2;
    } else {
      score += len * 10;
      growth += len;
    }
    combo++;
    updateHud();
    updateSlime();
    nextWord();
  }

  function onMiss(){
    growth = Math.max(0, growth - 3);
    combo = 0;
    updateHud();
    updateSlime();
    slimeEl.classList.remove('miss');
    void slimeEl.offsetWidth;
    slimeEl.classList.add('miss');
  }

  function handleChar(ch){
    if (!running || !currentWord) return;
    ch = ch.toLowerCase();
    var expected = currentWord.romaji[typedIndex];
    if (ch === expected) {
      typedIndex++;
      renderWord();
      if (typedIndex >= currentWord.romaji.length) onWordComplete();
    } else {
      onMiss();
    }
  }

  window.addEventListener('keydown', function(e){
    if (!running) return;
    if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) handleChar(e.key);
  });

  function tick(){
    timeLeft--;
    elapsed++;
    updateHud();
    if (timeLeft <= 0) endGame();
  }

  function startGame(){
    score = 0;
    growth = 0;
    combo = 0;
    timeLeft = GAME_SECONDS;
    elapsed = 0;
    running = true;
    currentWord = null;
    introEl.classList.add('hidden');
    resultEl.classList.add('hidden');
    updateHud();
    updateSlime();
    nextWord();
    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 1000);
  }

  function endGame(){
    running = false;
    clearInterval(timerId);
    finalLevelEl.textContent = slimeLevel();
    finalScoreEl.textContent = score + ' 点';
    resultEl.classList.remove('hidden');
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  updateHud();
})();
</script>
<script>
(() => {
  const MUSIC_TRACKS = ['pop', 'speed', 'dark', 'limit'];
  const musicSelect = document.getElementById('musicSelect');
  const musicToggle = document.getElementById('musicToggle');
  const bgm = new Audio();
  bgm.loop = true;
  bgm.volume = 0.5;
  let bgmStarted = false;
  let musicOn = true;

  function playTrack(key) {
    bgm.src = `../../assets/music/${key}.mp3`;
    bgm.currentTime = 0;
    bgm.play().catch(() => {});
  }

  musicSelect.addEventListener('change', () => playTrack(musicSelect.value));

  musicToggle.addEventListener('click', () => {
    musicOn = !musicOn;
    bgm.muted = !musicOn;
    musicToggle.textContent = musicOn ? '🔊 BGM ON' : '🔇 BGM OFF';
    if (musicOn && bgmStarted && bgm.paused) bgm.play().catch(() => {});
  });

  document.getElementById('startBtn').addEventListener('click', () => {
    if (bgmStarted) return;
    bgmStarted = true;
    const randomKey = MUSIC_TRACKS[Math.floor(Math.random() * MUSIC_TRACKS.length)];
    musicSelect.value = randomKey;
    playTrack(randomKey);
  }, { once: true });
})();
</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const vpadWrap = document.getElementById('vpadWrap');
  const vpadToggle = document.getElementById('vpadToggle');
  const vpadR = document.getElementById('vpadR');

  function setVpadVisible(v) {
    vpadWrap.classList.toggle('hidden', !v);
  }
  let vpadVisible = false;
  setVpadVisible(vpadVisible);
  vpadToggle.addEventListener('click', () => {
    vpadVisible = !vpadVisible;
    setVpadVisible(vpadVisible);
  });

  function dispatchKey(type, key) {
    const target = (document.activeElement && document.activeElement !== document.body)
      ? document.activeElement : window;
    target.dispatchEvent(new KeyboardEvent(type, { key, code: key, bubbles: true, cancelable: true }));
  }

  document.querySelectorAll('.vpadBtn').forEach((btn) => {
    const key = btn.dataset.key;
    const press = (e) => { e.preventDefault(); dispatchKey('keydown', key); };
    const release = (e) => { e.preventDefault(); dispatchKey('keyup', key); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
  });

  vpadR.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dispatchKey('keydown', 'Enter');
    dispatchKey('keyup', 'Enter');
  });
});
</script>
</body>
</html>
