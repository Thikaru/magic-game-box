<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ちぇいん花火ディフェンス — DAILY GAMES</title>
<style>
  :root { --bg:#10163a; --gold:#ffd23f; --pink:#ff5da2; --cyan:#4dd8e6; --paper:#fffdf5; --ink:#1c1c28; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#1b2470,#0b0f2c); color:var(--paper); min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; min-height:44px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--pink); padding:10px 0; }
  h1 { color:var(--gold); font-size:1.1rem; }
  .stage { position:relative; }
  canvas { display:block; width:100%; height:auto; border:3px solid var(--gold); border-radius:12px; background:#0b0f2c; touch-action:none; cursor:crosshair; }
  .overlay { position:absolute; inset:3px; border-radius:9px; background:rgba(11,15,44,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px; overflow-y:auto; }
  .overlay h2 { color:var(--gold); font-size:1.5rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--gold); color:var(--ink); border:0; border-radius:10px; min-height:48px; padding:0 36px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #b8912a; }
  .hidden { display:none; }
  .hud { display:flex; justify-content:space-between; margin-top:8px; font-weight:700; color:var(--cyan); font-size:.95rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎆 ちぇいん花火ディフェンス</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="stage">
    <canvas id="game" width="360" height="540"></canvas>
    <div class="overlay" id="intro">
      <h2>🎆 ちぇいん花火ディフェンス</h2>
      <p>空から降ってくる🎈を、花火で撃ち落とそう!</p>
      <p><b>タップした場所</b>に花火が飛んで、少し遅れて爆発します。</p>
      <p>割れた🎈もその場で<b>連鎖爆発</b>!たくさん巻き込むほど高得点。</p>
      <p>⭐金の🎈は大きな爆発、💣黒い🎈は割ると小さく爆発して<b>ライフが減る</b>ので、できれば放置!</p>
      <p>地面に落ちた🎈でライフが減ります(5つ)。</p>
      <p style="color:var(--cyan)">PC: マウスでクリック / 矢印キーで照準移動 + スペースで発射</p>
      <button class="btn" id="startBtn" type="button">スタート</button>
    </div>
    <div class="overlay hidden" id="over">
      <h2 id="overTitle">ゲームオーバー</h2>
      <p id="overText"></p>
      <button class="btn" id="retryBtn" type="button">もういちど</button>
    </div>
  </div>
  <div class="hud"><span id="hScore">スコア 0</span><span id="hCombo">最大連鎖 0</span><span id="hLife">❤️❤️❤️❤️❤️</span></div>
</div>
<script src="game.js"></script>
</body>
</html>
