<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>のぼれ!カエルのクイズ池わたり — DAILY GAMES</title>
<style>
  :root { --g:#3fae5a; --ink:#103018; --paper:#f4fff0; --water:#2f8fd8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:#d8f3dc; color:var(--ink); min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  header a { color:var(--ink); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--g); min-height:44px; display:inline-flex; align-items:center; white-space:nowrap; }
  h1 { font-size:1.05rem; color:#1f6b35; }
  .stage { position:relative; }
  .pond { position:relative; height:430px; border:4px solid var(--g); border-radius:12px; background:linear-gradient(#bfe9ff,#8fd0f5); overflow:hidden; }
  .water { position:absolute; left:0; right:0; top:0; height:0%; background:rgba(47,143,216,.85); transition:height .15s linear; border-bottom:4px solid #fff; }
  .water::after { content:"🌊 みずが せまってる!"; position:absolute; bottom:4px; left:0; right:0; text-align:center; color:#fff; font-size:.8rem; font-weight:700; }
  .qbox { position:absolute; left:10px; right:10px; top:50%; transform:translateY(-70%); background:var(--paper); border-radius:14px; padding:14px 10px; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.15); }
  .qtag { font-size:.8rem; color:#1f6b35; font-weight:700; }
  .qtext { font-size:1.6rem; font-weight:800; margin-top:4px; line-height:1.3; }
  .frog { position:absolute; bottom:12px; font-size:2.4rem; left:50%; transform:translateX(-50%); transition:left .15s; }
  .frog.ng { filter:hue-rotate(160deg); }
  .pads { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .pad { font-family:inherit; font-size:1.25rem; font-weight:800; color:#fff; background:var(--g); border:0; border-radius:50% / 40%; min-height:64px; padding:6px 4px; box-shadow:0 5px 0 #23783a; cursor:pointer; word-break:keep-all; }
  .pad:active { transform:translateY(2px); box-shadow:0 3px 0 #23783a; }
  .pad.ok { background:#ffd23f; color:var(--ink); box-shadow:0 5px 0 #b38d00; }
  .pad.ng { background:#d9534f; box-shadow:0 5px 0 #8c2a27; }
  .hud { display:flex; justify-content:space-between; margin-top:10px; font-weight:700; font-size:.95rem; }
  .overlay { position:absolute; inset:4px; border-radius:8px; background:rgba(244,255,240,.96); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; }
  .overlay h2 { color:#1f6b35; font-size:1.5rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--g); color:#fff; border:0; border-radius:10px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #23783a; cursor:pointer; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐸 カエルのクイズ池わたり</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="stage">
    <div class="pond" id="pond">
      <div class="water" id="water"></div>
      <div class="qbox"><div class="qtag" id="qtag"></div><div class="qtext" id="qtext"></div></div>
      <div class="frog" id="frog">🐸</div>
    </div>
    <div class="pads" id="pads">
      <button type="button" class="pad" data-i="0"></button>
      <button type="button" class="pad" data-i="1"></button>
      <button type="button" class="pad" data-i="2"></button>
    </div>
    <div class="hud"><span id="prog">0/15</span><span id="combo"></span><span id="best">BEST -</span></div>

    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>🌊 池のみずが どんどん上から せまってくる!</p>
      <p>❓ 出てくるクイズの<b>正解のハス</b>へジャンプして、みずをおしもどそう。</p>
      <p>🐸 15もん正解で池をわたりきれば クリア。<br>まちがえるとみずが一気にふえるよ。</p>
      <p>🔁 「まちがいをえらべ」「なかまはずれ」など<br>ひっかけ問題もあるよ。よく読んで!</p>
      <p>⌨ ←・↓・→ / 1・2・3 キー ・ 📱 ハスをタップ</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="result">
      <h2 id="rTitle"></h2>
      <p id="rText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
