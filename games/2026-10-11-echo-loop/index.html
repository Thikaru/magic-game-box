<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ざんぞうループ — DAILY GAMES</title>
<style>
  :root { --bg:#14102b; --gold:#ffd23f; --pink:#ff5da2; --cyan:#4dd8e6; --paper:#fffdf5; --ink:#1c1c28; --ca:#ff9f1c; --cb:#2ec4b6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#241a4d,#0d0a20); color:var(--paper); min-height:100vh; overflow-x:hidden; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; min-height:44px; gap:8px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--pink); padding:10px 0; white-space:nowrap; }
  h1 { color:var(--gold); font-size:1.05rem; }
  .hud { display:flex; justify-content:space-between; font-weight:700; color:var(--cyan); font-size:.85rem; margin-bottom:6px; }
  .stage { position:relative; }
  .board { container-type:inline-size; display:grid; grid-template-columns:repeat(7,1fr); gap:2px; background:#0d0a20; border:3px solid var(--gold); border-radius:12px; padding:4px; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .c { aspect-ratio:1; border-radius:6px; background:#2b2358; display:flex; align-items:center; justify-content:center; font-size:8cqw; position:relative; line-height:1; font-weight:800; }
  .c.void { background:transparent; }
  .c.wall { background:#0d0a20; border:2px solid #3a3070; }
  .c.plate { border:3px solid; border-radius:50%; font-size:5cqw; }
  .c.pa { border-color:var(--ca); color:var(--ca); } .c.pb { border-color:var(--cb); color:var(--cb); }
  .c.plate.lit.pa { background:var(--ca); color:var(--ink); } .c.plate.lit.pb { background:var(--cb); color:var(--ink); }
  .c.door { font-size:5cqw; color:var(--ink); }
  .c.da.closed { background:var(--ca); } .c.db.closed { background:var(--cb); }
  .c.door.open { background:transparent; border:2px dashed; } .c.da.open { border-color:var(--ca); color:var(--ca); } .c.db.open { border-color:var(--cb); color:var(--cb); }
  .g { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .g.ghost { opacity:.55; filter:grayscale(.3) hue-rotate(160deg); }
  .overlay { position:absolute; inset:0; border-radius:12px; background:rgba(13,10,32,.95); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; z-index:3; }
  .overlay h2 { color:var(--gold); font-size:1.4rem; margin-bottom:10px; }
  .overlay p { line-height:1.65; font-size:.9rem; margin-bottom:6px; }
  .btn { margin-top:12px; font-family:inherit; font-size:1.05rem; font-weight:700; background:var(--gold); color:var(--ink); border:0; border-radius:10px; min-height:48px; padding:0 30px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #b8912a; }
  .btn.sub { background:#4a3f86; color:var(--paper); box-shadow:0 5px 0 #2d2658; }
  .hidden { display:none !important; }
  #msg { min-height:2.6em; margin:8px 0; font-size:.88rem; line-height:1.5; color:var(--paper); text-align:center; }
  .acts { display:flex; gap:8px; margin-bottom:8px; }
  .acts button { flex:1; font-family:inherit; font-size:.8rem; font-weight:700; min-height:46px; border:0; border-radius:10px; background:#4a3f86; color:var(--paper); cursor:pointer; }
  .acts button.main { background:var(--pink); }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(3,56px); gap:6px; justify-content:center; margin:8px 0; }
  .pad button { font-size:1.4rem; border:0; border-radius:12px; background:#4a3f86; color:var(--paper); min-height:44px; cursor:pointer; touch-action:manipulation; }
  .pad button:active { background:var(--pink); }
  .tog { display:block; margin:6px auto 0; font-family:inherit; font-size:.85rem; min-height:44px; padding:0 18px; border-radius:10px; border:2px solid #4a3f86; background:transparent; color:var(--paper); cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>👻 ざんぞうループ</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="hud"><span id="hStage">ステージ 1/4</span><span id="hLoop">ループ 1/3</span><span id="hTurn">ターン 0/16</span><span id="hLife">❤️❤️❤️</span></div>
  <div class="stage">
    <div class="board" id="board"></div>
    <div class="overlay" id="intro">
      <h2>👻 ざんぞうループ</h2>
      <p>🐱を動かして🏁ゴールをめざそう。でも道は<b>カギのとびら</b>でふさがれている!</p>
      <p>丸い<b>スイッチ</b>の上に誰かが乗っている間だけ、同じ色のとびらが開きます。</p>
      <p>ループを終えると、あなたの動きが<b>👻ざんぞう</b>として次のループで再生され、スイッチを押し続けてくれます。</p>
      <p>ループ回数には上限あり。ミスは❤️が減ります(3つ)。</p>
      <p style="color:var(--cyan)">1ターン=1マス移動。1ループは16ターンまで。<br>PC: 矢印/WASD で移動・スペースで待機・Enterでループ終了・Rでやり直し</p>
      <button class="btn" id="startBtn" type="button">スタート</button>
    </div>
    <div class="overlay hidden" id="res">
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <button class="btn" id="nextBtn" type="button">つぎへ</button>
      <button class="btn hidden" id="retryBtn" type="button">もういちど</button>
    </div>
  </div>
  <div id="msg"></div>
  <div class="acts">
    <button type="button" class="main" id="endBtn">👻 ここでざんぞうにする</button>
    <button type="button" id="resetLoopBtn">↩ このループやり直し</button>
  </div>
  <button type="button" class="tog" id="togBtn">🎮 コントローラ</button>
  <div class="pad" id="pad">
    <span></span><button type="button" data-d="up" aria-label="上">▲</button><span></span>
    <button type="button" data-d="left" aria-label="左">◀</button><button type="button" data-d="wait" aria-label="待機">⏸</button><button type="button" data-d="right" aria-label="右">▶</button>
    <span></span><button type="button" data-d="down" aria-label="下">▼</button><span></span>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
