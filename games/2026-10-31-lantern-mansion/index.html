<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くらやみハロウィンやかた — DAILY GAMES</title>
<style>
  :root { --orange:#ff9a1f; --ink:#1a1020; --paper:#fff6e6; --purple:#2a1640; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:linear-gradient(180deg,#1d0f2e,#0a0512); color:var(--paper); min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--orange); min-height:44px; display:inline-flex; align-items:center; white-space:nowrap; }
  h1 { color:var(--orange); font-size:1.05rem; }
  .stage { position:relative; }
  canvas { display:block; width:100%; height:auto; border:4px solid var(--orange); border-radius:12px; background:#000; touch-action:none; user-select:none; -webkit-user-select:none; }
  .overlay { position:absolute; inset:4px; border-radius:8px; background:rgba(14,6,24,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; }
  .overlay h2 { color:var(--orange); font-size:1.5rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--orange); color:var(--ink); border:0; border-radius:10px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #a8610f; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #a8610f; }
  .hidden { display:none !important; }
  .hud { display:flex; justify-content:space-between; margin-top:8px; font-weight:700; color:#ffd9a0; font-size:.95rem; }
  .oil { height:10px; background:#3a2050; border-radius:5px; margin-top:6px; overflow:hidden; }
  .oil i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff6a00,#ffd23f); }
  .toggle { display:block; width:100%; margin-top:10px; min-height:44px; font-family:inherit; font-size:1rem; font-weight:700; color:var(--paper); background:#3a2050; border:2px solid #6a4a90; border-radius:10px; }
  .pad { display:grid; grid-template-columns:repeat(3,64px); grid-template-rows:repeat(2,56px); gap:6px; justify-content:center; margin-top:10px; }
  .pad button { font-size:1.4rem; color:var(--ink); background:#ffc46b; border:0; border-radius:12px; box-shadow:0 4px 0 #a8610f; touch-action:none; user-select:none; -webkit-user-select:none; }
  .pad button:active { transform:translateY(2px); box-shadow:0 2px 0 #a8610f; }
  #bUp { grid-column:2; grid-row:1; } #bLeft { grid-column:1; grid-row:2; } #bDown { grid-column:2; grid-row:2; } #bRight { grid-column:3; grid-row:2; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎃 くらやみハロウィンやかた</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="stage">
    <canvas id="game" width="476" height="588"></canvas>

    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>🏚️ まっくらなやかたに迷いこんだよ。<br>🏮 ランタンのまわりだけが見える!</p>
      <p>🍬 キャンディを<b>5こ</b>あつめて、<br>🚪 でぐちから脱出しよう。</p>
      <p>🛢️ ランタンの油はどんどんへって、<br>視界がせまくなる。見つけたら回復!<br>油がゼロでゲームオーバー。</p>
      <p>👻 おばけは暗がりからしのびよる。<br>3回ぶつかるとアウト。</p>
      <p>⌨ 矢印キー / WASD ・ 📱 下のボタンや<br>画面のスワイプで移動</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="result">
      <h2 id="resultTitle">ゲームオーバー</h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>

  <div class="hud">
    <span id="candyLabel">🍬 0/5</span>
    <span id="heartLabel">♥♥♥</span>
    <span id="bestLabel">BEST 0</span>
  </div>
  <div class="oil"><i id="oilBar"></i></div>

  <button type="button" class="toggle" id="toggleBtn">🎮 コントローラ</button>
  <div class="pad hidden" id="pad">
    <button type="button" id="bUp" aria-label="うえ">▲</button>
    <button type="button" id="bLeft" aria-label="ひだり">◀</button>
    <button type="button" id="bDown" aria-label="した">▼</button>
    <button type="button" id="bRight" aria-label="みぎ">▶</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
