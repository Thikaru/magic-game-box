<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひなたぼっこ!ねこのおひるね — DAILY GAMES</title>
<style>
  :root { --brown:#4a3a2a; --sun:#ffd54a; --shade:#6b6f8f; --accent:#ff8a3d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:linear-gradient(180deg,#cfe8ff,#fff1c9); color:var(--brown); min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  header a { color:var(--brown); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--accent); min-height:44px; display:inline-flex; align-items:center; white-space:nowrap; }
  h1 { font-size:1.05rem; }
  .stage { position:relative; background:#fffaf0; border:4px solid var(--accent); border-radius:14px; padding:12px; min-height:480px; }
  .hud { display:flex; justify-content:space-between; font-weight:700; margin-bottom:8px; font-size:.95rem; }
  .cat { text-align:center; font-size:3rem; line-height:1.2; min-height:3.6rem; }
  .msg { text-align:center; font-weight:700; min-height:1.6em; margin-bottom:8px; font-size:.95rem; }
  .board { display:grid; gap:6px; margin:0 auto; width:min(100%,340px); }
  .cell { aspect-ratio:1; border:0; border-radius:12px; font-size:1.8rem; cursor:pointer; touch-action:manipulation; background:var(--shade); color:#fff; box-shadow:0 4px 0 #474a66; transition:background .15s; min-height:44px; }
  .cell.on { background:var(--sun); box-shadow:0 4px 0 #d9a91b; }
  .cell.ice { background:#bfe9ff; box-shadow:0 4px 0 #86bfe0; cursor:default; }
  .cell.cur { outline:3px dashed var(--accent); outline-offset:2px; }
  .cell:active:not(.ice) { transform:translateY(2px); }
  .row { display:flex; gap:8px; margin-top:14px; }
  .sub { flex:1; min-height:48px; font-family:inherit; font-size:1rem; font-weight:700; color:var(--brown); background:#ffd9b8; border:0; border-radius:12px; box-shadow:0 4px 0 #d9a679; cursor:pointer; }
  .sub:disabled { opacity:.5; }
  .overlay { position:absolute; inset:0; border-radius:10px; background:rgba(255,250,240,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; }
  .overlay h2 { font-size:1.45rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #c4631a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #c4631a; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐱 ねこのおひるね</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="stage">
    <div class="hud">
      <span id="stageLabel">ステージ 1/5</span>
      <span id="movesLabel">のこり 0 手</span>
    </div>
    <div class="cat" id="cat">😾</div>
    <div class="msg" id="msg">&nbsp;</div>
    <div class="board" id="board"></div>
    <div class="row">
      <button type="button" class="sub" id="resetBtn">↺ やりなおし(のこり3)</button>
    </div>

    <div class="overlay" id="intro">
      <h2>🐱 あそびかた</h2>
      <p>ねこは<b>ぜんぶ日なた☀️</b>になるまで<br>おこっているよ。</p>
      <p>マスをタップすると、そのマスと<b>上下左右</b>の<br>日なた⇄日かげが入れかわる!</p>
      <p>❄️ <b>氷のマスは動かない</b>(ステージ3から)。<br>タップしても、氷だけはそのまま。</p>
      <p>手数には<b>かぎり</b>があるよ。5ステージクリアでおひるね成功!<br>「やりなおし」は全部で3回まで。</p>
      <p>⌨ 矢印キーでえらんで Enter / スペースでタップ</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
