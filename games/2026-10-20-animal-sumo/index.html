<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>のこった!どうぶつ相撲 — DAILY GAMES</title>
<style>
  :root { --bg:#2b1d14; --sand:#e8c98a; --rope:#c0392b; --ink:#2b1d14; --paper:#fff8e7; --gold:#ffd23f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--paper); min-height:100vh; }
  .wrap { max-width:560px; margin:0 auto; padding:14px 12px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  header a { color:var(--paper); text-decoration:none; font-size:.85rem; border-bottom:2px dotted var(--gold); padding:10px 0; }
  h1 { color:var(--gold); font-size:1.15rem; }
  .stage { position:relative; }
  canvas { display:block; width:100%; height:auto; border:4px solid var(--gold); border-radius:12px; background:#3a2a1c; touch-action:none; }
  .overlay { position:absolute; inset:4px; border-radius:8px; background:rgba(30,18,10,.94); display:flex; flex-direction:column;
    align-items:center; text-align:center; padding:18px 16px; overflow-y:auto; }
  .overlay h2 { color:var(--gold); font-size:1.4rem; margin-bottom:10px; }
  .overlay p { line-height:1.8; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--gold); color:var(--ink); border:0;
    border-radius:10px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .hidden { display:none !important; }
  .pad { display:flex; gap:12px; margin-top:12px; }
  .act { flex:1; min-height:72px; border-radius:14px; border:2px solid rgba(255,255,255,.5); font-family:inherit; font-size:1.05rem;
    font-weight:700; color:#fff; touch-action:none; user-select:none; -webkit-user-select:none; cursor:pointer; }
  .act small { display:block; font-size:.7rem; font-weight:400; opacity:.85; }
  #pushBtn { background:#c0392b; } #braceBtn { background:#2c6fb0; }
  .act:active { filter:brightness(1.25); }
  .toggle { margin-top:10px; font-family:inherit; font-size:.85rem; color:#fff; background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:0 14px; min-height:44px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏟️ のこった!どうぶつ相撲</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="stage">
    <canvas id="game" width="480" height="300"></canvas>

    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>🐰うさぎ関になって、三番勝負!<br>どひょうの外へ相手をおしだそう。</p>
      <p>🔴 <b>つっぱり</b>(連打 / スペース・Z)<br>おすたびに<b>スタミナ</b>が減る。へとへとだと押せない。</p>
      <p>🔵 <b>どっしり</b>(X・↓)<br>相手が<b>⚠️ぶちかまし</b>の予告を出したら、<br>ギリギリでふんばろう!成功で<b>うっちゃり</b>&amp;大チャンス。<br>早すぎ・おそすぎは吹っ飛ばされる。</p>
      <p>「のこった!」の声でいちばんに押すと立ち合いボーナス。<br>早すぎるとフライング。</p>
      <p>2回まけたら終わり。時間切れは押している方の勝ち。</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="result">
      <h2 id="resultTitle"></h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>

  <div id="padArea">
    <div class="pad" id="pad">
      <button type="button" class="act" id="pushBtn">🔴 つっぱり<small>れんだ!</small></button>
      <button type="button" class="act" id="braceBtn">🔵 どっしり<small>⚠️のとき!</small></button>
    </div>
  </div>
  <button type="button" class="toggle" id="padToggle">🎮 コントローラ</button>
</div>
<script src="game.js"></script>
</body>
</html>
