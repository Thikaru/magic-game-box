<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぼやけ絵文字クイズ — DAILY GAMES</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { overflow-x:hidden; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#1d2b53,#0f1630); color:#fff; min-height:100vh; }
  .wrap { max-width:420px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  header h1 { font-size:1.15rem; color:#ffd23f; }
  header a { color:#fff; font-size:.9rem; text-decoration:none; border-bottom:2px dotted #ff77a8; min-height:44px; display:flex; align-items:center; }
  .hud { display:flex; justify-content:space-between; font-weight:700; margin-bottom:6px; font-size:.95rem; }
  .hud .pts { color:#7dffb0; }
  .stage { position:relative; }
  canvas { display:block; width:100%; aspect-ratio:1/1; border:4px solid #ffd23f; border-radius:14px; background:#f4f1e6; }
  .bar { height:10px; background:rgba(255,255,255,.15); border-radius:5px; margin:8px 0 10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ff77a8,#ffd23f); }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choices button { min-height:56px; font-size:1.05rem; font-weight:700; font-family:inherit; border:0; border-radius:12px; background:#fffdf5; color:#1c1c28; box-shadow:0 4px 0 #b8b4a2; cursor:pointer; padding:6px; }
  .choices button:disabled { opacity:.4; box-shadow:none; text-decoration:line-through; }
  .choices button.ok { background:#7dffb0; }
  .choices button.ng { background:#ff8a8a; }
  .overlay { position:absolute; inset:4px; border-radius:10px; background:rgba(15,22,48,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px; overflow-y:auto; }
  .overlay h2 { color:#ffd23f; font-size:1.5rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .overlay .big { font-size:2.2rem; font-weight:800; color:#7dffb0; }
  .btn { margin-top:14px; font-size:1.1rem; font-weight:800; font-family:inherit; background:#ffd23f; color:#1c1c28; border:0; border-radius:12px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .hidden { display:none !important; }
  .msg { text-align:center; min-height:1.6em; margin-top:10px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 ぼやけ絵文字クイズ</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="hud"><span id="qno">1 / 10</span><span class="pts" id="nowpts">いま正解で +100</span><span id="score">0てん</span></div>
  <div class="stage">
    <canvas id="cv" width="360" height="360"></canvas>
    <div class="overlay" id="startOv">
      <h2>ぼやけ絵文字クイズ</h2>
      <p>モザイクだらけの絵文字が、だんだんくっきり見えてくる!</p>
      <p>何かわかったら4つの名前からタップ。<br>早く答えるほど高得点(最大100)。</p>
      <p>まちがえると −15点で、その選択肢は消えます。<br>連続正解ボーナスもあるよ。全10問。</p>
      <p>キーボード:1〜4キーでも選べます</p>
      <button class="btn" id="startBtn" type="button">スタート</button>
    </div>
    <div class="overlay hidden" id="endOv">
      <h2 id="endTitle">けっか</h2>
      <div class="big" id="endScore">0てん</div>
      <p id="endDetail"></p>
      <button class="btn" id="retryBtn" type="button">もういちど</button>
    </div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="choices" id="choices"></div>
  <div class="msg" id="msg"></div>
</div>
<script src="game.js"></script>
</body>
</html>
