<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ワザカード・ブロウル — DAILY GAMES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;background:#1d1530;color:#fff7e8;min-height:100vh;overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;padding:12px 12px 32px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
header a{color:#ffd23f;font-size:.9rem;display:inline-flex;align-items:center;min-height:44px}
h1{font-size:1.1rem;color:#ffd23f}
.stage{position:relative}
.board{background:#2b2046;border:3px solid #ffd23f;border-radius:14px;padding:12px;min-height:440px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fighter{text-align:center;flex:1}
.face{font-size:3.4rem;line-height:1.1;transition:transform .15s}
.face.hit{transform:translateX(8px) rotate(6deg)}
.bar{height:14px;background:#0006;border-radius:7px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:#5fe08a;transition:width .3s}
.bar.e i{background:#ff6b6b}
.sm{font-size:.8rem}
.intent{margin:10px 0;padding:10px;border-radius:10px;background:#0005;text-align:center;font-size:.95rem;line-height:1.5;min-height:64px}
.log{min-height:44px;font-size:.85rem;text-align:center;color:#ffd23f;line-height:1.5;margin-bottom:8px}
.status{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:8px}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.card{width:30%;min-width:96px;min-height:84px;border:2px solid #fff7e8;border-radius:10px;background:#3d2e66;color:#fff7e8;font-size:.8rem;padding:6px 4px;cursor:pointer;font-family:inherit;line-height:1.35}
.card b{display:block;font-size:1.5rem}
.card:disabled{opacity:.35;cursor:default}
.card:not(:disabled):active{transform:translateY(2px)}
.btn{font-family:inherit;font-size:1.05rem;background:#ffd23f;color:#1c1c28;border:0;border-radius:10px;padding:0 28px;min-height:48px;box-shadow:0 4px 0 #b8912a;cursor:pointer}
.end{display:block;margin:12px auto 0;width:100%}
.overlay{position:absolute;inset:0;border-radius:12px;background:rgba(20,12,36,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow-y:auto}
.overlay h2{color:#ffd23f;font-size:1.5rem;margin-bottom:12px}
.overlay p{line-height:1.8;font-size:.92rem;margin-bottom:6px}
.overlay .btn{margin-top:14px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><a href="../../index.html">← トップへもどる</a><h1>ワザカード・ブロウル</h1></header>
<div class="stage">
 <div class="board" id="board">
  <div class="row">
   <div class="fighter"><div class="face" id="pFace">🥋</div><div class="bar"><i id="pBar"></i></div><div class="sm" id="pHp"></div></div>
   <div style="font-size:1.4rem">⚔️</div>
   <div class="fighter"><div class="face" id="eFace"></div><div class="bar e"><i id="eBar"></i></div><div class="sm" id="eHp"></div></div>
  </div>
  <div class="intent" id="intent"></div>
  <div class="log" id="log"></div>
  <div class="status"><span id="energy"></span><span id="combo"></span><span id="round"></span></div>
  <div class="hand" id="hand"></div>
  <button class="btn end" id="endBtn">ターンおわり (Space)</button>
 </div>
 <div class="overlay" id="startOv">
  <h2>🥋 ワザカード・ブロウル</h2>
  <p>手札のワザカードを使って、3人の相手をたおそう!</p>
  <p>⚡ 毎ターン エネルギー3。カードをタップ(キー1〜5)で使います。</p>
  <p>相手は<b>次にやること</b>を予告します。<br>
  🛡️ガードで防ぎ、<b>🔄カウンター</b>は相手が攻撃してくる時だけ大反撃!<br>
  💥ため→次は大技。カウンターが決まれば逆転のチャンス。</p>
  <p>👊攻撃カードを続けて出すと れんけいボーナス。<br>相手が🛡ぼうぎょ中は与えるダメージ半分。</p>
  <p>終わったら「ターンおわり」(Space / Enter)。</p>
  <button class="btn" id="startBtn">スタート</button>
 </div>
 <div class="overlay hidden" id="endOv">
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <button class="btn" id="retryBtn">もういちど</button>
 </div>
</div>
</div>
<script src="game.js"></script>
</body>
</html>
