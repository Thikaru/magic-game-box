<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>くりかえす9びょう!タイムループ脱出 — DAILY GAMES</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { overflow-x:hidden; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:#1a1330; color:#fff; min-height:100vh; -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:420px; margin:0 auto; padding:10px 12px 24px; position:relative; min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  header h1 { font-size:1rem; color:#ffd23f; }
  header a { color:#fff; font-size:.9rem; text-decoration:none; border-bottom:2px dotted #b9a2ff; min-height:44px; display:flex; align-items:center; }
  .hud { display:flex; justify-content:space-between; font-weight:800; font-size:.95rem; margin:2px 0 6px; }
  .bar { height:14px; background:#2d2350; border-radius:7px; overflow:hidden; }
  #fill { height:100%; width:100%; background:#7dffb0; transition:background .2s; }
  #msg { height:1.6em; text-align:center; font-weight:800; margin:8px 0; color:#ffd23f; }
  #room { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .obj { font-family:inherit; color:#fff; background:#352a5e; border:0; border-radius:14px; min-height:92px; font-size:2.2rem; box-shadow:0 5px 0 #20193d; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .obj small { font-size:.72rem; margin-top:4px; opacity:.85; }
  .obj:active { transform:translateY(3px); box-shadow:0 2px 0 #20193d; }
  .obj.bad { opacity:.3; box-shadow:none; }
  .obj.ok { background:#2f8f5b; }
  #note { margin-top:14px; background:#241b45; border-radius:12px; padding:8px 10px; }
  #note h3 { font-size:.8rem; color:#b9a2ff; margin-bottom:6px; }
  #slots { display:flex; gap:6px; justify-content:space-between; }
  .slot { flex:1; min-height:48px; border-radius:10px; background:#150f2b; display:flex; align-items:center; justify-content:center; font-size:1.5rem; color:#6b5fa0; border:2px dashed #4a3d80; }
  .slot.known { border-style:solid; border-color:#ffd23f; color:#fff; }
  .slot.done { background:#2f8f5b; border-color:#7dffb0; }
  .btn { font-size:1.1rem; font-weight:800; font-family:inherit; background:#ffd23f; color:#1c1c28; border:0; border-radius:12px; padding:0 22px; min-height:52px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .overlay { position:absolute; inset:0; background:rgba(20,12,44,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:18px; z-index:5; }
  .overlay h2 { color:#ffd23f; font-size:1.45rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .overlay .btn { margin-top:14px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>⏳ タイムループ脱出</h1><a href="../../index.html">← トップへ</a></header>
  <div class="hud"><span id="loop">ループ 1/5</span><span id="time">9.0s</span></div>
  <div class="bar"><div id="fill"></div></div>
  <div id="msg"></div>
  <div id="room"></div>
  <div id="note"><h3>📓 ノート(おぼえた手順)</h3><div id="slots"></div></div>

  <div id="intro" class="overlay">
    <h2>⏳ くりかえす9びょう!<br>タイムループ脱出</h2>
    <p>9秒ごとに時間がもどる部屋。<br>道具の位置も毎回シャッフルされるよ。</p>
    <p>5つの道具を<b>正しい順番</b>でタップできれば脱出!<br>
    正しい次の道具は📓ノートに記録されて、ループしても<b>のこる</b>。<br>
    まちがえるとその道具は「ちがう」とわかるけど、<b>2秒</b>ロス。</p>
    <p>5ループ以内に、1回の9秒で最後までたどり着こう。</p>
    <p><b>操作:</b>道具をタップ / キー 1〜6</p>
    <button id="start" class="btn">スタート</button>
  </div>
  <div id="over" class="overlay hidden">
    <h2 id="otitle"></h2>
    <p id="result"></p>
    <button id="retry" class="btn">もういちど</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
