<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひよこ5にちかん — DAILY GAMES</title>
<style>
  :root { --bg:#fff4d6; --ink:#4a3320; --orange:#ff9f43; --green:#5fb878; --blue:#5aa9e6; --pink:#ff7aa8; --card:#fffdf5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#ffe9a8,#fff4d6 60%,#d9f0c8); color:var(--ink); min-height:100vh; overflow-x:hidden; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; min-height:44px; gap:8px; }
  header a { color:var(--ink); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--pink); padding:10px 0; white-space:nowrap; }
  h1 { font-size:1.05rem; }
  .hud { display:flex; justify-content:space-between; font-weight:700; font-size:.85rem; margin-bottom:6px; }
  .stage { position:relative; }
  .field { background:var(--card); border:3px solid var(--orange); border-radius:14px; padding:10px; min-height:340px; }
  .chick { text-align:center; font-size:5rem; line-height:1.1; transition:transform .2s; }
  .chick.hop { transform:translateY(-14px) scale(1.08); }
  .bubble { margin:4px auto 10px; max-width:280px; text-align:center; background:#fff; border:2px solid var(--pink); border-radius:14px; padding:6px 10px; font-size:.88rem; font-weight:700; min-height:2.2em; }
  .bars { display:grid; gap:6px; }
  .bar { display:grid; grid-template-columns:5.6em 1fr 2.2em; align-items:center; gap:6px; font-size:.82rem; font-weight:700; }
  .track { height:14px; background:#eadfc4; border-radius:7px; overflow:hidden; }
  .fill { height:100%; border-radius:7px; transition:width .25s, background .25s; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  #msg { min-height:2.8em; margin:8px 0; font-size:.88rem; line-height:1.5; text-align:center; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .acts button { font-family:inherit; font-size:.95rem; font-weight:700; min-height:56px; border:0; border-radius:12px; background:var(--card); color:var(--ink); box-shadow:0 4px 0 #d4c293; cursor:pointer; touch-action:manipulation; line-height:1.3; }
  .acts button small { display:block; font-size:.68rem; font-weight:500; opacity:.75; }
  .acts button:active { transform:translateY(2px); box-shadow:0 2px 0 #d4c293; }
  .overlay { position:absolute; inset:0; border-radius:14px; background:rgba(255,244,214,.97); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; z-index:3; }
  .overlay h2 { font-size:1.4rem; margin-bottom:10px; }
  .overlay p { line-height:1.65; font-size:.9rem; margin-bottom:6px; }
  .btn { margin-top:12px; font-family:inherit; font-size:1.05rem; font-weight:700; background:var(--orange); color:#fff; border:0; border-radius:10px; min-height:48px; padding:0 30px; box-shadow:0 5px 0 #c9742a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #c9742a; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐥 ひよこ5にちかん</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="hud"><span id="hDay">1日目</span><span id="hSlot">のこり 5</span><span id="hScore">⭐ 0</span></div>
  <div class="stage">
    <div class="field">
      <div class="chick" id="chick">🐣</div>
      <div class="bubble" id="bubble">…</div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="overlay" id="intro">
      <h2>🐥 ひよこ5にちかん</h2>
      <p>たまごからうまれたひよこを<b>5日間</b>そだてよう。1日に<b>5回</b>おせわができるよ。</p>
      <p>どのおせわも、ひとつをふやす代わりに<b>べつのどれか</b>がへるよ。時間がたつと全部すこしずつ下がる!</p>
      <p>ひよこの<b>💭ねがい</b>をかなえるとごほうび。でも<b>たべすぎ</b>には注意…。</p>
      <p>どれかが0になるとたおれてしまうよ。5日目のおわりに、いちばん高いパラメータで<b>姿が進化</b>!</p>
      <p>操作: ボタンをタップ(キーボードは 1〜4)</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="result">
      <h2 id="rTitle"></h2>
      <div style="font-size:4rem" id="rEmoji"></div>
      <p id="rText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
  <div id="msg"></div>
  <div class="acts" id="acts"></div>
</div>
<script src="game.js"></script>
</body>
</html>
