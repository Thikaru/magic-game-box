<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はしれ!しりとりレース — DAILY GAMES</title>
<style>
  :root { --bg:#10202b; --acc:#ffcf33; --red:#ff6b6b; --paper:#fffdf5; --ink:#1c1c28; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:var(--bg); color:var(--paper); min-height:100vh; overflow-x:hidden; }
  .wrap { max-width:440px; margin:0 auto; padding:8px 12px 28px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--acc); padding:12px 0; }
  h1 { color:var(--acc); font-size:1.05rem; }
  .hud { display:flex; justify-content:space-between; font-weight:700; margin-bottom:6px; font-size:.95rem; }
  .stage { position:relative; }
  canvas { display:block; width:100%; height:auto; border:4px solid var(--acc); border-radius:12px; background:#333; touch-action:manipulation; }
  .overlay { position:absolute; inset:0; border-radius:10px; background:rgba(16,32,43,.95); display:flex; flex-direction:column; align-items:center; text-align:center; padding:18px 14px; overflow-y:auto; z-index:5; }
  .overlay h2 { color:var(--acc); font-size:1.3rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.9rem; margin-bottom:6px; }
  .btn { margin-top:12px; font-family:inherit; font-size:1.05rem; font-weight:700; background:var(--acc); color:var(--ink); border:0; border-radius:10px; padding:0 30px; min-height:48px; box-shadow:0 4px 0 #b8912a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 2px 0 #b8912a; }
  .btn.sub { background:#2f5d7a; color:#fff; box-shadow:0 4px 0 #1d3c50; padding:0 16px; font-size:.95rem; }
  .row { display:flex; gap:10px; justify-content:center; margin-top:10px; }
  .hidden { display:none !important; }
  #pad { display:flex; gap:12px; justify-content:center; margin-top:12px; }
  #pad button { flex:1; max-width:150px; min-height:60px; font-size:1.6rem; border:0; border-radius:12px; background:#2f5d7a; color:#fff; box-shadow:0 3px 0 #1d3c50; touch-action:manipulation; }
  #pad button:active { transform:translateY(2px); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏎️ はしれ!しりとりレース</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="hud"><span id="score">スコア 0</span><span id="goal">ゴールまで 20</span><span id="hearts">❤️❤️❤️</span></div>
  <div class="stage">
    <canvas id="cv" width="360" height="480"></canvas>
    <div class="overlay" id="intro">
      <h2>🏎️ あそびかた</h2>
      <p>3車線のコースを走るよ。前から<b>ゲート</b>が3つならんで近づいてくる!</p>
      <p>上に出ている言葉の<b>さいごの文字</b>から はじまる言葉のゲートを通ろう。<br>(例: ねこ → <b>こ</b>あら)</p>
      <p>正解のゲートを通るとつぎの「しりとり」へ。まちがえるとハートが1つへるよ。ハート0でゲームオーバー!</p>
      <p>正解がつづくと🔥コンボでスピードも得点もアップ。<b>20こ</b>つなげたらゴール!</p>
      <p>⌨ ← → / A D ・ 📱 車線をタップ or 下のボタン</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="result">
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
  <div class="row"><button class="btn sub" id="padToggle">🎮 コントローラ</button></div>
  <div id="pad" class="hidden">
    <button id="bl" aria-label="左">◀</button><button id="br" aria-label="右">▶</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
