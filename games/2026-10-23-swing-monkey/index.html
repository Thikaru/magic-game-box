<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とべ!ぶらんこモンキー — DAILY GAMES</title>
<style>
  :root { --sky:#8fd8ff; --leaf:#3fae5a; --sun:#ffd23f; --ink:#1c2a24; --paper:#fffdf5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; background:linear-gradient(180deg,#14532d,#0b2e1a); color:var(--paper); min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--sun); min-height:44px; display:inline-flex; align-items:center; }
  h1 { color:var(--sun); font-size:1.1rem; }
  .stage { position:relative; }
  canvas { display:block; width:100%; height:auto; border:4px solid var(--sun); border-radius:12px; background:var(--sky); touch-action:none; user-select:none; -webkit-user-select:none; }
  .overlay { position:absolute; inset:4px; border-radius:8px; background:rgba(11,46,26,.93); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; overflow-y:auto; }
  .overlay h2 { color:var(--sun); font-size:1.5rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.92rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-family:inherit; font-size:1.1rem; font-weight:700; background:var(--sun); color:var(--ink); border:0; border-radius:10px; padding:0 36px; min-height:48px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #b8912a; }
  .hidden { display:none; }
  .hud { display:flex; justify-content:space-between; margin-top:8px; font-weight:700; color:#c8ffd8; }
  .actBtn { display:block; width:100%; margin-top:10px; min-height:56px; font-family:inherit; font-size:1.1rem; font-weight:700; color:var(--ink); background:#9be7a8; border:0; border-radius:12px; box-shadow:0 5px 0 #4c9a5c; touch-action:none; user-select:none; -webkit-user-select:none; }
  .actBtn:active { transform:translateY(2px); box-shadow:0 3px 0 #4c9a5c; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐒 とべ!ぶらんこモンキー</h1>
    <a href="../../index.html">← トップへ</a>
  </header>

  <div class="stage">
    <canvas id="game" width="480" height="600"></canvas>

    <div class="overlay" id="intro">
      <h2>あそびかた</h2>
      <p>🐒 ロープにぶらさがってゆれているよ。<br><b>タップ</b>で手をはなして、ジャンプ!</p>
      <p>空中で<b>もういちどタップ</b>すると、<br>近くのロープにつかまれるよ。</p>
      <p>🍌 バナナは+20点。ロープを渡るたび+100点。</p>
      <p>🍃 みどりのロープは、つかまって<br>1.6秒でちぎれちゃう!</p>
      <p>水に落ちるとハートが1つへる(3つ)。</p>
      <p>⌨ スペース / ↑ / ↓ / クリックでもOK</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div class="overlay hidden" id="result">
      <h2 id="resultTitle">ゲームオーバー</h2>
      <p id="resultText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>

  <div class="hud">
    <span id="scoreLabel">SCORE 0</span>
    <span id="bestLabel">BEST 0</span>
    <span id="livesLabel">♥♥♥</span>
  </div>
  <button type="button" class="actBtn" id="actBtn">👆 つかむ / はなす</button>
</div>
<script src="game.js"></script>
</body>
</html>
