<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つづけて!ミュートビート — DAILY GAMES</title>
<style>
  :root { --ink:#0d1030; --paper:#f2f4ff; --pink:#ff4f9a; --cyan:#37e0ff; --gold:#ffd23f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x:hidden; }
  body { font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; background:linear-gradient(180deg,#151a4a,#070918); color:var(--paper); min-height:100vh; }
  .wrap { max-width:420px; margin:0 auto; padding:12px 12px 32px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:44px; margin-bottom:8px; }
  header a { color:var(--paper); text-decoration:none; font-size:.9rem; border-bottom:2px dotted var(--pink); padding:12px 0; }
  h1 { color:var(--gold); font-size:1.05rem; }
  .hud { display:flex; justify-content:space-between; font-weight:700; margin-bottom:8px; font-size:.9rem; }
  .stage { position:relative; background:#0b0e2e; border:3px solid var(--cyan); border-radius:14px; padding:14px 10px 12px; }
  .phase { text-align:center; font-weight:700; min-height:1.6em; color:var(--cyan); }
  .phase.mute { color:var(--pink); }
  .orb { width:120px; height:120px; margin:10px auto; border-radius:50%; background:radial-gradient(circle at 35% 30%,#7af0ff,#2a6cff); display:flex; align-items:center; justify-content:center; font-size:3rem; transition:transform .08s; }
  .orb.beat { transform:scale(1.18); }
  .orb.silent { background:#1b2050; opacity:.55; }
  .dots { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; min-height:34px; margin:4px 0 8px; }
  .dot { width:26px; height:26px; border-radius:50%; border:3px solid #4a5290; font-size:.7rem; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .dot.aud { border-color:var(--cyan); }
  .dot.aud.on { background:var(--cyan); }
  .dot.sil { border-style:dashed; border-color:var(--pink); }
  .dot.perfect { background:var(--gold); border:3px solid var(--gold); color:var(--ink); }
  .dot.good { background:#6be68a; border:3px solid #6be68a; color:var(--ink); }
  .dot.miss { background:#e33; border:3px solid #e33; }
  .msg { text-align:center; min-height:1.7em; font-weight:700; color:var(--gold); }
  .pad { display:flex; align-items:center; justify-content:center; height:130px; margin-top:8px; border-radius:14px; background:linear-gradient(180deg,var(--pink),#c21e6c); font-size:1.3rem; font-weight:700; box-shadow:0 6px 0 #7d0f44; user-select:none; touch-action:manipulation; cursor:pointer; }
  .pad.down { transform:translateY(3px); box-shadow:0 3px 0 #7d0f44; }
  .overlay { position:absolute; inset:0; border-radius:12px; background:rgba(7,9,24,.96); display:flex; flex-direction:column; align-items:center; text-align:center; padding:16px; overflow-y:auto; z-index:5; }
  .overlay h2 { color:var(--gold); font-size:1.3rem; margin-bottom:10px; }
  .overlay p { line-height:1.7; font-size:.9rem; margin-bottom:6px; }
  .btn { margin-top:14px; font-size:1.1rem; font-weight:700; background:var(--gold); color:var(--ink); border:0; border-radius:10px; min-height:48px; padding:0 36px; box-shadow:0 5px 0 #b8912a; cursor:pointer; }
  .btn:active { transform:translateY(2px); box-shadow:0 3px 0 #b8912a; }
  .hidden { display:none; }
  .note { margin-top:8px; font-size:.8rem; opacity:.8; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔇 ミュートビート</h1>
    <a href="../../index.html">← トップへ</a>
  </header>
  <div class="hud">
    <span id="hRound">ラウンド 1/8</span>
    <span id="hBpm">♩=84</span>
    <span id="hLife">❤️❤️❤️</span>
    <span id="hScore">0点</span>
  </div>
  <div class="stage">
    <div class="phase" id="phase">じゅんび…</div>
    <div class="orb silent" id="orb">🥁</div>
    <div class="dots" id="dots"></div>
    <div class="msg" id="msg"></div>
    <div class="overlay" id="intro">
      <h2>🔇 つづけて!ミュートビート</h2>
      <p>最初の4拍は<b style="color:#37e0ff">音が鳴ります</b>。そのテンポを体でおぼえて…</p>
      <p>そのあとは<b style="color:#ff4f9a">音も光も消えます</b>。<br>消えた拍(点線の●)のタイミングで、おなじテンポのままタップ!</p>
      <p>ズレが小さいほど高得点(✨ぴったり / 👍ほぼ)。大きくズレると❤️が減ります。ラウンドが進むほどテンポが速く、消える拍も長くなります。全8ラウンドをやりきれる?</p>
      <p>👆 下のボタンをタップ / ⌨ スペースキー<br>🔊 音を出して遊んでね</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>
    <div class="overlay hidden" id="result">
      <h2 id="rTitle"></h2>
      <p id="rText"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>
  </div>
  <div class="pad" id="pad">👆 TAP</div>
  <p class="note">消えた拍の瞬間にぴったり押そう</p>
</div>
<script src="game.js"></script>
</body>
</html>
